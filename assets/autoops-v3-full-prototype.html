<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EmpoworX自动化运维平台V3.0全功能原型</title>
  <style>
    :root {
      --primary: #0f5bff;
      --primary-weak: #eaf2ff;
      --text: #202633;
      --muted: #687386;
      --line: #e4e8f0;
      --panel: #ffffff;
      --bg: #f5f7fb;
      --green: #17b26a;
      --orange: #f79009;
      --red: #f04438;
      --blue: #2563eb;
      --shadow: 0 8px 24px rgba(16, 24, 40, .08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 14px;
      background: var(--bg);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: 208px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 208px;
      background:
        radial-gradient(circle at 80% 8%, rgba(80, 152, 255, .22), transparent 24%),
        linear-gradient(160deg, #f8fbff 0%, #e7f2ff 100%);
      border-right: 1px solid #dfe7f2;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    .brand {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      font-weight: 700;
      color: #27364a;
      border-bottom: 1px solid rgba(215, 224, 238, .75);
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: var(--primary);
      position: relative;
    }

    .brand-icon:before,
    .brand-icon:after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 6px;
    }

    .brand-icon:before {
      width: 10px;
      height: 2px;
      top: 5px;
      left: 4px;
      box-shadow: 0 4px 0 #fff, 0 8px 0 #fff;
    }

    .brand-icon:after {
      width: 2px;
      height: 14px;
      top: 2px;
      left: 8px;
      opacity: .45;
    }

    .menu {
      padding: 14px 0;
      flex: 1;
      overflow: auto;
    }

    .menu-item {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      color: #2d3a4c;
      border-left: 3px solid transparent;
      transition: .18s ease;
    }

    .menu-item:hover {
      color: var(--primary);
      background: rgba(255, 255, 255, .55);
    }

    .menu-item.active {
      color: var(--primary);
      font-weight: 700;
      border-left-color: var(--primary);
      background: linear-gradient(90deg, rgba(15, 91, 255, .12), rgba(255, 255, 255, .76));
    }

    .menu-icon {
      width: 18px;
      text-align: center;
      font-size: 16px;
    }

    .version {
      padding: 18px;
      color: #8b96a8;
      font-size: 13px;
    }

    .main {
      grid-column: 2;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 48px;
      background:
        radial-gradient(circle at 72% 0%, rgba(79, 151, 255, .34), transparent 18%),
        #fff;
      border-bottom: 1px solid #edf0f5;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 4;
    }

    .user-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      margin-left: 4px;
    }

    .content {
      padding: 22px;
      overflow: auto;
      min-height: calc(100vh - 48px);
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid #e8ecf3;
      box-shadow: 0 1px 0 rgba(16, 24, 40, .02);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      min-height: 40px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      color: #1d2736;
    }

    .page-subtitle {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .toolbar,
    .filters {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      height: 30px;
      border: 1px solid #cbd5e1;
      color: #1f2a3a;
      background: #fff;
      padding: 0 12px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .btn:disabled {
      cursor: not-allowed;
      color: #98a2b3;
      border-color: #d7dde8;
      background: #f3f5f8;
    }

    .btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn.danger {
      border-color: #fecaca;
      color: var(--red);
      background: #fff7f7;
    }

    .btn.ghost {
      background: #f8fafc;
    }

    .input,
    .select,
    .textarea {
      height: 32px;
      border: 1px solid #cfd7e6;
      border-radius: 3px;
      padding: 0 10px;
      min-width: 180px;
      background: #fff;
      color: #1f2937;
      outline: none;
    }

    .textarea {
      height: 78px;
      padding: 8px 10px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(15, 91, 255, .1);
    }

    .code-snippet {
      margin-top: 10px;
      padding: 12px 14px;
      border: 1px solid #d8e2f0;
      border-radius: 4px;
      background: #f7f9fc;
      color: #243043;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .section {
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      font-weight: 700;
      color: #1f2937;
    }

    .tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 16px;
    }

    .tab {
      height: 40px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: #344054;
      position: relative;
      font-weight: 600;
    }

    .tab.active {
      color: var(--primary);
    }

    .tab.active:after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: -1px;
      height: 2px;
      background: var(--primary);
    }

    .subtabs {
      display: flex;
      gap: 0;
      margin: 4px 0 14px;
    }

    .subtab {
      height: 34px;
      min-width: 88px;
      border: 1px solid #cfd7e6;
      background: #fff;
      color: #344054;
      margin-left: -1px;
    }

    .subtab:first-child {
      margin-left: 0;
      border-radius: 3px 0 0 3px;
    }

    .subtab:last-child {
      border-radius: 0 3px 3px 0;
    }

    .subtab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      z-index: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
      border: 1px solid var(--line);
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 10px 9px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #f8fafc;
      color: #1f2937;
      font-weight: 700;
    }

    tr:hover td {
      background: #fbfdff;
    }

    .service-table-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .service-table-scroll table {
      min-width: 1500px;
      border: 0;
    }

    .api-table-scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    .api-table-scroll table {
      min-width: 1320px;
      border: 0;
    }

    .service-list-table th:last-child,
    .service-list-table td:last-child {
      position: sticky;
      right: 0;
      width: 188px;
      min-width: 188px;
      background: #fff;
      z-index: 2;
      box-shadow: -8px 0 12px rgba(16, 24, 40, .06);
    }

    .service-list-table th:last-child {
      background: #f8fafc;
      z-index: 3;
    }

    .service-list-table .service-actions {
      overflow: visible;
      text-overflow: clip;
      white-space: nowrap;
    }

    .service-list-table .service-actions .link {
      padding: 0 3px;
      font-size: 13px;
    }

    .link {
      color: var(--primary);
      background: transparent;
      border: 0;
      padding: 0 5px;
      height: 24px;
    }

    .muted-link {
      color: #98a2b3;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 24px;
      padding: 0 8px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-size: 13px;
      line-height: 1;
    }

    .tag.green { color: #079455; background: #e7f8ef; border-color: #b7ebcd; }
    .tag.orange { color: #b54708; background: #fff3df; border-color: #fed7aa; }
    .tag.red { color: #d92d20; background: #fff0ef; border-color: #fecaca; }
    .tag.gray { color: #667085; background: #f2f4f7; border-color: #e4e7ec; }
    .tag.blue { color: #155eef; background: #eff5ff; border-color: #bfdbfe; }
    .tag.p1 { color: #ff3b30; background: #fff1f1; border-color: #ffd1d1; }
    .tag.p2 { color: #f79009; background: #fff5e8; border-color: #fed7aa; }
    .tag.p3 { color: #12b76a; background: #ecfdf3; border-color: #bbf7d0; }
    .tag.p4 { color: #7a8494; background: #f5f6f8; border-color: #e5e7eb; }

    .switch {
      width: 46px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: #cbd5e1;
      padding: 3px;
      transition: .2s;
      border: 0;
    }

    .switch:before {
      content: "";
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.18);
      transition: .2s;
    }

    .switch.on {
      background: var(--primary);
    }

    .switch.on:before {
      transform: translateX(22px);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      padding: 16px;
      min-height: 92px;
      position: relative;
      overflow: hidden;
    }

    .stat:after {
      content: "";
      position: absolute;
      right: -18px;
      top: -18px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(15, 91, 255, .08);
    }

    .stat-label {
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #172033;
    }

    .stat-note {
      margin-top: 8px;
      font-size: 12px;
      color: #7c8798;
    }

    .flow {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow: auto;
      padding-bottom: 2px;
    }

    .flow-step {
      min-width: 128px;
      min-height: 58px;
      border: 1px solid #cfe0ff;
      background: #f7fbff;
      color: #1d4ed8;
      border-radius: 4px;
      padding: 9px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.35;
      position: relative;
    }

    .flow-step:not(:last-child):after {
      content: ">";
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      color: #8aa7d9;
      font-weight: 700;
      z-index: 1;
    }

    .split {
      display: grid;
      grid-template-columns: 238px 1fr;
      gap: 14px;
    }

    .tree {
      border: 1px solid var(--line);
      background: #fff;
      min-height: 436px;
      padding: 12px;
    }

    .tree-search {
      width: 100%;
      margin-bottom: 10px;
      min-width: 0;
    }

    .tree-node {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: #344054;
      border-radius: 3px;
    }

    .tree-node.active {
      color: var(--primary);
      background: var(--primary-weak);
      font-weight: 700;
    }

    .progress {
      height: 8px;
      border-radius: 999px;
      background: #eef2f7;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0f5bff, #50a3ff);
    }

    .gray-progress-panel {
      margin: 18px 6px 0;
      padding: 16px 18px;
      border: 1px solid #dbe7ff;
      background: #f8fbff;
      border-radius: 4px;
    }

    .gray-progress-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .gray-progress-title {
      font-weight: 700;
      color: #1d2736;
    }

    .gray-progress-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }

    .gray-progress-item {
      background: #fff;
      border: 1px solid #e4eaf4;
      border-radius: 3px;
      padding: 10px 12px;
    }

    .gray-progress-item span {
      display: block;
      color: #667085;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .gray-progress-item b {
      font-size: 14px;
      color: #1f2937;
    }

    .gray-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .gray-step {
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      background: #edf2fb;
      color: #667085;
      font-size: 13px;
    }

    .gray-step.active {
      background: var(--primary);
      color: #fff;
      font-weight: 700;
    }

    .metric-card {
      background: #fff;
      border: 1px solid var(--line);
      padding: 12px;
      min-height: 210px;
    }

    .metric-title {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .chart {
      height: 138px;
      border-left: 1px solid #dce5f2;
      border-bottom: 1px solid #dce5f2;
      position: relative;
      margin: 16px 8px 2px 26px;
      background: repeating-linear-gradient(to top, #fff 0, #fff 26px, #edf2fb 27px);
    }

    .chart-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 22px;
      height: 76px;
      background:
        linear-gradient(135deg, transparent 0 10%, #5c7cdb 10.6% 11.4%, transparent 12% 28%, #5c7cdb 28.6% 29.4%, transparent 30% 62%, #5c7cdb 62.6% 63.4%, transparent 64% 74%, #5c7cdb 74.4% 75.4%, transparent 76%),
        linear-gradient(45deg, transparent 0 50%, rgba(92,124,219,.12) 51% 52%, transparent 53%);
    }

    .api-trend-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .api-trend-range {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .api-trend-range .btn.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .api-trend-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .api-trend-stat {
      min-width: 0;
      height: 58px;
      padding: 0 14px;
      border: 1px solid #dbe3ef;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }

    .api-trend-stat-label {
      color: #344054;
      font-size: 14px;
    }

    .api-trend-stat-value {
      color: #101828;
      font-size: 24px;
      white-space: nowrap;
    }

    .api-trend-stat-value small {
      color: #667085;
      font-size: 12px;
      margin-left: 3px;
    }

    .api-trend-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px 22px;
    }

    .api-trend-chart {
      min-width: 0;
      padding: 2px 0 4px;
    }

    .api-trend-chart-head {
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
      font-weight: 600;
      color: #344054;
    }

    .api-trend-chart-head .select {
      min-width: 136px;
      width: auto;
      height: 30px;
      padding: 2px 28px 2px 8px;
    }

    .trend-svg {
      display: block;
      width: 100%;
      height: 150px;
      overflow: visible;
    }

    .trend-grid-line { stroke: #e6ebf2; stroke-width: 1; }
    .trend-axis-text { fill: #98a2b3; font-size: 10px; }
    .trend-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .trend-dot { fill: #fff; stroke-width: 1.5; }

    .api-trend-note {
      margin-top: 12px;
      color: #667085;
      font-size: 12px;
    }

    @media (max-width: 820px) {
      .api-trend-summary,
      .api-trend-grid { grid-template-columns: 1fr; }
      .api-trend-toolbar { align-items: flex-start; flex-direction: column; }
    }

    .bar-chart {
      height: 136px;
      display: flex;
      align-items: end;
      gap: 12px;
      padding: 18px 16px 0;
      border-bottom: 1px solid #dce5f2;
    }

    .bar {
      flex: 1;
      min-width: 20px;
      background: linear-gradient(180deg, #60a5fa, #0f5bff);
      border-radius: 3px 3px 0 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 120px 1fr 120px 1fr;
      gap: 12px 14px;
      align-items: center;
    }

    .form-label {
      text-align: right;
      color: #344054;
    }

    .form-label.required:before {
      content: "*";
      color: var(--red);
      margin-right: 3px;
    }

    .form-row-full {
      grid-column: 2 / 5;
    }

    .modal-mask,
    .drawer-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .42);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-mask {
      z-index: 1000;
    }

    .drawer-mask {
      z-index: 900;
    }

    .modal-mask.show,
    .drawer-mask.show {
      display: flex;
    }

    .modal {
      width: min(760px, calc(100vw - 40px));
      max-height: calc(100vh - 60px);
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
    }

    .modal.large {
      width: min(980px, calc(100vw - 40px));
    }

    .modal.xlarge {
      width: min(1120px, calc(100vw - 40px));
    }

    .modal.version-modal {
      width: min(560px, calc(100vw - 40px));
    }

    .modal-head {
      height: 52px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body {
      padding: 18px;
      overflow: auto;
    }

    .version-switch-body {
      padding: 6px 10px 0;
    }

    .version-summary {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      min-height: 102px;
      padding: 18px;
      margin-bottom: 18px;
      background: #f7f9fc;
    }

    .version-summary-divider {
      width: 1px;
      align-self: stretch;
      background: #e8edf5;
    }

    .version-main {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
    }

    .version-sub {
      margin-top: 16px;

    function trendChart(title, values, color, options = {}) {
      const maxValue = options.max || Math.max(...values, 1);
      const chartWidth = 420;
      const chartHeight = 132;
      const left = 34;
      const right = 8;
      const top = 10;
      const bottom = 24;
      const usableWidth = chartWidth - left - right;
      const usableHeight = chartHeight - top - bottom;
      const points = values.map((value, index) => {
        const x = left + index * (usableWidth / Math.max(values.length - 1, 1));
        const y = top + usableHeight - (value / maxValue) * usableHeight;
        return { x, y, value };
      });
      const polyline = points.map(point => `${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
      const grid = [0, .33, .66, 1].map(rate => {
        const y = top + usableHeight * rate;
        const label = Math.round(maxValue * (1 - rate));
        return `<line class="trend-grid-line" x1="${left}" y1="${y}" x2="${chartWidth - right}" y2="${y}"></line><text class="trend-axis-text" x="0" y="${y + 3}">${label}</text>`;
      }).join("");
      const dots = points.map(point => `<circle class="trend-dot" cx="${point.x}" cy="${point.y}" r="2.3" stroke="${color}"></circle>`).join("");
      const labels = ["00:00", "02:00", "04:00", "06:00", "08:00", "10:00"].map((label, index, source) => {
        const x = left + index * (usableWidth / (source.length - 1));
        return `<text class="trend-axis-text" x="${x}" y="${chartHeight - 3}" text-anchor="middle">${label}</text>`;
      }).join("");
      const heading = options.percentile
        ? `<select class="select" data-action="trendPercentage"><option value="50" ${state.apiTrendPercentage === 50 ? "selected" : ""}>P50响应时间(ms)</option><option value="95" ${state.apiTrendPercentage === 95 ? "selected" : ""}>P95响应时间(ms)</option><option value="99" ${state.apiTrendPercentage === 99 ? "selected" : ""}>P99响应时间(ms)</option></select>`
        : `<span>${title}</span>`;
      return `<div class="api-trend-chart"><div class="api-trend-chart-head">${heading}</div><svg class="trend-svg" viewBox="0 0 ${chartWidth} ${chartHeight}" role="img" aria-label="${title}">${grid}<polyline class="trend-line" points="${polyline}" stroke="${color}"></polyline>${dots}${labels}</svg></div>`;
    }

      } else if (type === "thirdAppLog") {
        foot.innerHTML = `<button class="btn" data-close="modal">关闭</button><button class="btn primary" data-action="thirdAppLogRefresh">刷新日志</button>`;
      } else {
        foot.innerHTML = `<button class="btn" data-close="modal">取消</button><button class="btn primary" data-action="saveModal">${type === "deploy" ? "切换" : type === "thirdAppUninstall" ? "确认卸载" : "确认"}</button>`;
      }
      document.getElementById("modalMask").classList.add("show");
    }

    function openDrawer(type) {
      const [title, html] = drawerContent(type);
      document.getElementById("drawerTitle").textContent = title;
      document.getElementById("drawerBody").innerHTML = html;
      document.querySelector("#drawerMask .drawer").className = "drawer";
      document.getElementById("drawerMask").classList.add("show");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    function addLog(message) {
      const now = new Date();
      const t = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}:${String(now.getSeconds()).padStart(2,"0")}`;
      state.logs.unshift([t, "superAdmin", message]);
      if (state.logs.length > 20) state.logs.pop();
    }

    function renderAll() {
      renderOverview();
      renderService();
      renderServiceDetail();
      renderApiControl();
      renderBase();
      renderPipeline();
      renderGovernance();
      renderThirdApp();
      renderThirdAppDetail();
      renderVirtual();
      renderWarn();
      renderLogs();
      document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === state.page));
      const menuPage = state.page === "serviceDetail" ? "service" : state.page === "thirdAppDetail" ? "thirdApp" : state.page;
      document.querySelectorAll(".menu-item").forEach(i => i.classList.toggle("active", i.dataset.page === menuPage));
    }

    document.addEventListener("click", e => {
      const menu = e.target.closest("[data-page]");
      if (menu) {
        state.page = menu.dataset.page;
        document.getElementById("modalMask").classList.remove("show");
        document.getElementById("drawerMask").classList.remove("show");
        renderAll();
        return;
      }
      const jump = e.target.closest("[data-page-jump]");
      if (jump) {
        state.page = jump.dataset.pageJump;
        document.getElementById("modalMask").classList.remove("show");
        document.getElementById("drawerMask").classList.remove("show");
        renderAll();
        return;
      }
      const setTab = e.target.closest("[data-set-tab]");
      if (setTab) {
        const [key, value] = setTab.dataset.setTab.split(":");
        state[key] = value;
        renderAll();
        return;
      }
      const modal = e.target.closest("[data-modal]");
      if (modal) {
        if (modal.dataset.modal === "thirdAppUpload") state.thirdAppValidated = false;
        openModal(modal.dataset.modal, modal.dataset.title);
        return;
      }
      const drawer = e.target.closest("[data-drawer]");
      if (drawer) {
        openDrawer(drawer.dataset.drawer);
        return;
      }
      if (e.target.closest("[data-close='modal']")) {
        document.getElementById("modalMask").classList.remove("show");
        return;
      }
      if (e.target.closest("[data-close='drawer']")) {
        document.getElementById("drawerMask").classList.remove("show");
        return;
      }
      const action = e.target.closest("[data-action]");
      if (action) {
        const a = action.dataset.action;
        if (a === "saveModal" || a === "saveDrawer") {
          document.getElementById("modalMask").classList.remove("show");
          document.getElementById("drawerMask").classList.remove("show");
          const modalType = document.getElementById("modalBox").dataset.modalType;
          if (modalType === "thirdAppUninstall") {
            thirdAppRecords[0].status = "已卸载";
            thirdAppRecords[0].progress = 0;
            addLog(`执行第三方应用 ${thirdAppRecords[0].name} 标准包卸载脚本`);
            toast("已执行uninstall.sh，应用已卸载");
          } else if (modalType === "thirdAppOffline") {
            thirdAppRecords[0].status = "已下线";
            addLog(`执行 ${thirdAppRecords[0].name} 第三方应用下线`);
            toast("应用已下线");
          } else if (modalType === "thirdAppRestart") {
            addLog(`执行 ${thirdAppRecords[0].name} restart.sh --params runtime/params.env`);
            toast("重启任务已提交");
          } else {
            addLog(modalType === "breakerEdit" ? "保存熔断管控配置" : modalType === "deploy" ? "提交版本切换" : "保存配置并记录审计成功");
            toast(modalType === "deploy" ? "版本切换已提交" : "保存成功，已追加操作日志");
          }
          renderAll();
        } else if (a === "thirdAppValidate") {
          const required = [...document.querySelectorAll("#modalBody [data-third-required]")];
          const missing = required.find(input => !String(input.value || "").trim());
          if (!state.thirdPackageParsed || missing) {
            toast(!state.thirdPackageParsed ? "请先上传并解析部署压缩包" : "存在未填写的必填参数");
            missing?.focus();
            return;
          }
          state.thirdAppValidated = true;
          document.getElementById("thirdAppValidation")?.classList.add("show");
          const deployButton = document.querySelector("[data-action='thirdAppDeploy']");
          if (deployButton) deployButton.disabled = false;
          addLog(`完成 ${thirdAppRecords[0].name} 标准部署包和参数校验`);
          toast("配置校验通过");
        } else if (a === "thirdAppDeploy") {
          if (!state.thirdAppValidated) {
            toast("请先完成配置校验");
            return;
          }
          state.thirdDeployProgress = 25;
          thirdAppRecords[0].status = "部署中";
          thirdAppRecords[0].progress = 25;
          thirdAppRecords[0].deployTime = new Date().toLocaleString("zh-CN", { hour12: false }).replaceAll("/", "-");
          addLog("根据 deploy.json 创建独立任务目录并执行 install.sh --params runtime/params.env");
          renderThirdApp();
          openModal("thirdAppProgress");
        } else if (a === "refreshThirdDeploy") {
          const checkpoints = [25, 40, 55, 70, 85, 95, 100];
          const next = checkpoints.find(value => value > state.thirdDeployProgress) || 100;
          state.thirdDeployProgress = next;
          thirdAppRecords[0].progress = next;
          if (next >= 100) {
            thirdAppRecords[0].status = "运行中";
            addLog(`${thirdAppRecords[0].name} 部署完成，Deployment和Pod健康检查通过`);
            toast("第三方应用部署完成");
          } else {
            toast(`部署进度已更新为 ${next}%`);
          }
          document.getElementById("modalBody").innerHTML = thirdAppProgressContent();
          const refresh = document.querySelector("[data-action='refreshThirdDeploy']");
          if (refresh) refresh.textContent = next >= 100 ? "查看完成状态" : "刷新状态";
          renderThirdApp();
        } else if (a === "thirdAppStatusRefresh") {
          addLog(`刷新 ${thirdAppRecords[0].name} 部署资源和Pod状态`);
          toast("运行状态已刷新");
          renderThirdAppDetail();
        } else if (a === "thirdAppLogSearch") {
          toast("日志查询完成");
        } else if (a === "thirdAppLogRefresh") {
          addLog(`刷新 ${thirdAppRecords[0].name} 部署日志`);
          toast("日志已刷新");
        } else if (a === "thirdAppLogDownload") {
          addLog(`下载 ${thirdAppRecords[0].name} 脱敏部署日志`);
          toast("脱敏日志开始下载");
        } else if (a === "thirdAppTemplateDownload") {
          addLog("下载第三方应用标准部署包 v1.0");
          toast("规范模板开始下载");
        } else if (a === "thirdAppTogglePort") {
          state.thirdPortOpen = !state.thirdPortOpen;
          addLog(`${state.thirdPortOpen ? "开启" : "关闭"} ${thirdAppRecords[0].name} 对外端口`);
          toast(state.thirdPortOpen ? "端口已开启" : "端口已关闭");
          renderThirdApp();
        } else if (a === "toggleMonitor") {
          action.classList.toggle("on");
          addLog(action.classList.contains("on") ? "开启API监控" : "关闭API监控");
          toast(action.classList.contains("on") ? "已开启监控" : "已关闭监控");
        } else if (a === "trendTime") {
          state.apiTrendTimeType = action.dataset.value || "oneHour";
          document.getElementById("modalTitle").textContent = state.apiTrendTimeType === "oneHour" ? "最近一小时接口请求数据" : "接口请求趋势分析";
          document.getElementById("modalBody").innerHTML = apiTrendContent();
          addLog(`切换API趋势时间范围：${state.apiTrendTimeType}`);
        } else if (a === "refreshApiTrend") {
          addLog("刷新API接口趋势数据");
          toast("趋势数据已刷新");
        } else if (a === "search") {
          addLog("执行条件查询");
          toast("查询完成");
        } else if (a === "reset") {
          document.querySelectorAll(".page.active input").forEach(i => { if (i.type !== "checkbox" && i.type !== "radio") i.value = ""; });
          toast("查询条件已重置");
        } else if (a === "batchMonitorOn" || a === "batchMonitorOff") {
          addLog(a === "batchMonitorOn" ? "批量开启API监控" : "批量关闭API监控");
          toast(a === "batchMonitorOn" ? "批量开启监控完成" : "批量关闭监控完成");
        } else if (a === "breakerEnable" || a === "breakerDisable") {
          addLog(a === "breakerEnable" ? "启用熔断管控配置" : "停用熔断管控配置");
          toast(a === "breakerEnable" ? "熔断管控已启用" : "熔断管控已停用");
        } else if (a === "breakerDelete") {
          addLog("删除熔断管控配置");
          toast("熔断管控已删除");
        } else if (a === "toggleBreakerBlock") {
          action.classList.toggle("on");
          const row = action.closest("tr");
          const reasonCell = row?.children?.[4];
          if (reasonCell) reasonCell.textContent = action.classList.contains("on") ? "手动禁止上游调用" : "-";
          addLog(action.classList.contains("on") ? "禁止上游调用" : "取消禁止上游调用");
          toast(action.classList.contains("on") ? "已禁止上游调用" : "已取消禁止上游调用");
        } else if (a === "toggleGracefulGlobal") {
          state.gracefulGlobal = !state.gracefulGlobal;
          addLog(state.gracefulGlobal ? "优雅上下线已开启" : "优雅上下线已关闭");
          toast(state.gracefulGlobal ? "优雅上下线已开启" : "优雅上下线已关闭");
          renderAll();
        }
      }
    });

    document.addEventListener("change", e => {
      if (e.target.dataset.action === "trendPercentage") {
        state.apiTrendPercentage = Number(e.target.value) || 99;
        document.getElementById("modalBody").innerHTML = apiTrendContent();
        addLog(`切换API趋势百分位：P${state.apiTrendPercentage}`);
        return;
      }
      if (e.target.id !== "thirdPackageFile") return;
      const file = e.target.files?.[0];
      if (!file) return;
      state.thirdPackageParsed = true;
      state.thirdAppValidated = false;
      const name = document.getElementById("thirdPackageName");
      if (name) name.textContent = file.name;
      document.getElementById("thirdAppValidation")?.classList.remove("show");
      const deployButton = document.querySelector("[data-action='thirdAppDeploy']");
      if (deployButton) deployButton.disabled = true;
      addLog(`解析第三方应用部署包：${file.name}`);
      toast("压缩包解析完成，已识别 deploy.json、资源目录和根目录运维脚本");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.getElementById("modalMask").classList.remove("show");
        document.getElementById("drawerMask").classList.remove("show");
      }
    });

    function applyUrlState() {
      const params = new URLSearchParams(window.location.search);
      const page = params.get("page");
      const modal = params.get("modal");
      if (page) state.page = page;
      renderAll();
      if (modal) openModal(modal);
    }

    applyUrlState();
  </script>
</body>
</html>
